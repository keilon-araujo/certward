# Capsule Corp CA - nginx (Docker; upstreams por nome de servico)
# Roteia por PREFIXO de host (ca. / ocsp. / admin.) via regex, entao funciona
# para QUALQUER dominio configurado no wizard, sem precisar re-renderizar.
#
# admin.*  -> HTTPS (443), cert emitido pela propria CA (/ca/tls/admin.*)
# ca.*     -> HTTP (80)  distribuicao de ca.crt / ca.crl / chain (AIA/CRL sao http)
# ocsp.*   -> HTTP (80)  responder OCSP (RFC 6960 exige http)

# ---- Distribuicao dos artefatos publicos (ca.<dominio>) --------------------
server {
    listen 80;
    server_name ~^ca\.;
    root /ca/web;
    autoindex off;
    location ~ \.crl$ { default_type application/pkix-crl; add_header Cache-Control "no-cache"; }
    location ~ \.crt$ { default_type application/pkix-cert; }
    location /       { try_files $uri =404; }
}

# ---- Responder OCSP (ocsp.<dominio>) ---------------------------------------
server {
    listen 80;
    server_name ~^ocsp\.;
    location / {
        proxy_pass http://ocsp:2560;      # HTTP puro (RFC 6960), sem redirect
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ---- HTTP -> HTTPS para o admin e qualquer host desconhecido ---------------
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- Interface web de administracao em HTTPS (admin.<dominio>) --------------
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/tls/admin.crt;   # trocado p/ cert da CA em runtime
    ssl_certificate_key /etc/nginx/tls/admin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://webui:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;   # Basic Auth -> FastAPI
    }
}
