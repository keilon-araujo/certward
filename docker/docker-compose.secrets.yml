# Overlay OPT-IN de Docker secrets (produção).
#
# Tira ADMIN_PASS e a KEK das variáveis de ambiente / .env e passa a fornecê-las
# como Docker secrets (montados em /run/secrets, fora do volume de dados).
#
# Uso:
#   1) crie os arquivos (NÃO versionados — ver .gitignore):
#        mkdir -p docker/secrets
#        printf '%s' 'SUA_SENHA_ADMIN_FORTE'                 > docker/secrets/admin_pass
#        docker run --rm certward:latest python -c \
#          'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())' \
#          > docker/secrets/ca_kek
#        openssl rand -base64 24 | tr -d '\n'                > docker/secrets/ca_int_pass
#        chmod 600 docker/secrets/*
#   2) suba com os dois compose files:
#        docker compose -f docker/docker-compose.yml -f docker/docker-compose.secrets.yml up -d
#
# O app resolve os segredos por precedência: /run/secrets/<nome>  >  <ENV>_FILE  >  env.
# Com este overlay, a KEK e a passphrase da intermediária vivem FORA do volume:
# um vazamento do volume/backup não expõe as chaves cifradas em repouso.
#
# IMPORTANTE: defina ca_int_pass ANTES de inicializar a CA (o assistente cifra a
# chave da intermediária com ela). Guarde-a: sem ela, a CA não assina/renova.

services:
  webui:
    secrets: [admin_pass, ca_kek, ca_int_pass]
  ocsp:
    secrets: [ca_kek]
  crl:
    secrets: [ca_kek, ca_int_pass]

secrets:
  admin_pass:
    file: ./secrets/admin_pass
  ca_kek:
    file: ./secrets/ca_kek
  ca_int_pass:
    file: ./secrets/ca_int_pass
