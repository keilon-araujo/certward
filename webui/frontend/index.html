<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autoridade Certificadora — Console</title>
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme: dark;
  --bg:#0c0e11;
  --surface:#13161b;
  --surface-2:#191d23;
  --surface-3:#20252c;
  --border:#262c34;
  --border-strong:#39424e;
  --text:#e7eaef;
  --muted:#98a2b0;
  --faint:#6d7784;
  --accent:#f0a530;
  --accent-hover:#f7b64c;
  --accent-ink:#1b1204;
  --accent-soft:rgba(240,165,48,.13);
  --accent-line:rgba(240,165,48,.35);
  --ok:#3ddc97;
  --ok-soft:rgba(61,220,151,.12);
  --danger:#ff7a7a;
  --danger-soft:rgba(255,122,122,.12);
  --warn:#fbbf40;
  --warn-soft:rgba(251,191,64,.12);
  --info:#7fd0f5;
  --info-soft:rgba(127,208,245,.12);
  --focus:#7fd0f5;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
  --r-sm:7px;
}
:root[data-theme="light"], html:not([data-theme="dark"]) {}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f4f5f7;
    --surface:#ffffff;
    --surface-2:#f7f8fa;
    --surface-3:#eef0f3;
    --border:#e0e4e9;
    --border-strong:#c8cfd7;
    --text:#161a1f;
    --muted:#5c6672;
    --faint:#7b8592;
    --accent:#eb9a1e;
    --accent-hover:#d98a12;
    --accent-ink:#241704;
    --accent-soft:rgba(235,154,30,.14);
    --accent-line:rgba(180,110,10,.4);
    --ok:#0f7a52;
    --ok-soft:rgba(15,122,82,.1);
    --danger:#c0322f;
    --danger-soft:rgba(192,50,47,.09);
    --warn:#9a6208;
    --warn-soft:rgba(154,98,8,.11);
    --info:#0d6c92;
    --info-soft:rgba(13,108,146,.1);
    --focus:#0d6c92;
    --shadow:0 10px 28px rgba(20,26,34,.14);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f7f8fa; --surface-3:#eef0f3;
  --border:#e0e4e9; --border-strong:#c8cfd7; --text:#161a1f; --muted:#5c6672; --faint:#7b8592;
  --accent:#eb9a1e; --accent-hover:#d98a12; --accent-ink:#241704;
  --accent-soft:rgba(235,154,30,.14); --accent-line:rgba(180,110,10,.4);
  --ok:#0f7a52; --ok-soft:rgba(15,122,82,.1);
  --danger:#c0322f; --danger-soft:rgba(192,50,47,.09);
  --warn:#9a6208; --warn-soft:rgba(154,98,8,.11);
  --info:#0d6c92; --info-soft:rgba(13,108,146,.1);
  --focus:#0d6c92; --shadow:0 10px 28px rgba(20,26,34,.14);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent); text-decoration:none}
a:hover{color:var(--accent-hover); text-decoration:underline}
code,kbd,pre,.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
::selection{background:var(--accent-soft)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:color-mix(in oklab, var(--surface) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.hrow{
  max-width:1420px; margin:0 auto; padding:11px 20px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.mark{
  width:30px;height:30px;flex:none;border-radius:9px;
  background:var(--accent-soft); border:1px solid var(--accent-line);
  display:grid;place-items:center; color:var(--accent);
}
.brand b{font-size:14.5px; letter-spacing:-.015em; white-space:nowrap}
.brand span{display:block; font-size:11px; color:var(--faint); letter-spacing:.06em; text-transform:uppercase}
.hspace{flex:1 1 auto}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 11px 5px 9px; border-radius:99px; font-size:12px; font-weight:600;
  border:1px solid var(--border-strong); background:var(--surface-2); color:var(--muted);
}
.pill .dot{width:7px;height:7px;border-radius:99px;background:currentColor;flex:none}
.pill.ok{color:var(--ok); border-color:color-mix(in oklab, var(--ok) 40%, transparent); background:var(--ok-soft)}
.pill.warn{color:var(--warn); border-color:color-mix(in oklab, var(--warn) 45%, transparent); background:var(--warn-soft)}
.pill.ok .dot{box-shadow:0 0 0 3px var(--ok-soft)}

/* nav */
nav{border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:53px; z-index:39}
.nrow{max-width:1420px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nrow::-webkit-scrollbar{display:none}
.tab{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--muted); font:inherit; font-weight:500; font-size:13.5px;
  padding:11px 13px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:7px;
}
.tab:hover{color:var(--text)}
.tab[aria-current="page"]{color:var(--text); border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono); font-size:11px; color:var(--faint); background:var(--surface-3); padding:1px 5px; border-radius:5px}

/* ---------- layout ---------- */
main{max-width:1420px; margin:0 auto; padding:22px 20px 80px}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-h h2,.card-h h3{font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.card-b{padding:16px}
.sec-title{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}

/* ---------- buttons ---------- */
.btn{
  appearance:none; font:inherit; font-weight:550; font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:7px 12px; border-radius:var(--r-sm); cursor:pointer;
  background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong);
  transition:background .12s, border-color .12s, opacity .12s;
}
.btn:hover:not(:disabled){background:var(--surface-3)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:650}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn.danger{color:var(--danger); border-color:color-mix(in oklab, var(--danger) 45%, transparent); background:var(--danger-soft)}
.btn.danger:hover:not(:disabled){background:color-mix(in oklab, var(--danger) 18%, transparent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.btn.sm{padding:4px 9px; font-size:12px; gap:5px}
.btn.icon{padding:6px; border-radius:var(--r-sm)}
.btn svg{flex:none}

/* ---------- kpis ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:14px 15px; display:flex; flex-direction:column; gap:5px; position:relative; overflow:hidden;
}
.kpi .k{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
.kpi .v{font-size:29px; font-weight:640; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.1}
.kpi.ok .v{color:var(--ok)} .kpi.danger .v{color:var(--danger)} .kpi.warn .v{color:var(--warn)}
.kpi.hl{border-color:color-mix(in oklab,var(--warn) 45%,transparent); background:linear-gradient(180deg,var(--warn-soft),transparent 70%)}
.kpi .sub{font-size:11.5px;color:var(--faint)}

/* ---------- tree ---------- */
.tree{display:flex;flex-direction:column}
.node{position:relative; padding-left:0}
.node + .node{margin-top:10px}
.node.child{margin-left:22px; padding-left:26px}
.node.child:before{
  content:""; position:absolute; left:0; top:-10px; bottom:0; width:1px; background:var(--border-strong);
}
.node.child:after{
  content:""; position:absolute; left:0; top:24px; width:24px; height:1px; background:var(--border-strong);
}
.node.child.last:before{height:34px; bottom:auto}
.nbox{
  border:1px solid var(--border); border-radius:var(--r); background:var(--surface-2);
  padding:12px 14px; display:flex; flex-direction:column; gap:8px;
}
.nbox.root{background:linear-gradient(180deg,var(--accent-soft),transparent 60%); border-color:var(--accent-line)}
.nhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ntag{
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;
  padding:2px 7px;border-radius:5px;background:var(--surface-3);color:var(--muted);border:1px solid var(--border)
}
.nbox.root .ntag{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.nsubj{font-family:var(--mono); font-size:12.5px; word-break:break-all}
.meta{display:flex;flex-wrap:wrap;gap:4px 20px}
.meta div{display:flex;flex-direction:column;gap:1px;min-width:0}
.meta dt,.meta .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.meta dd,.meta .v{margin:0;font-size:12.5px}
.fp{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; min-width:920px}
thead th{
  text-align:left; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  font-weight:600; padding:9px 12px; border-bottom:1px solid var(--border); background:var(--surface-2);
  position:sticky; top:0; white-space:nowrap;
}
thead th.sortable{cursor:pointer; user-select:none}
thead th.sortable:hover{color:var(--text)}
thead th .arw{opacity:.5; font-size:9px}
tbody td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
td.num{font-family:var(--mono); font-size:12.5px; color:var(--muted)}
td.cn{font-weight:550; word-break:break-all; min-width:190px}
.dl{display:flex;gap:4px;flex-wrap:wrap}
.dl a{
  font-family:var(--mono); font-size:11px; padding:3px 7px; border-radius:5px;
  border:1px solid var(--border-strong); color:var(--muted); background:var(--surface-2); text-decoration:none;
}
.dl a:hover{color:var(--text); border-color:var(--accent-line); background:var(--accent-soft); text-decoration:none}
.dl span{font-family:var(--mono);font-size:11px;padding:3px 7px;color:var(--faint);opacity:.55;border:1px dashed var(--border);border-radius:5px}

/* badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:600;padding:2.5px 8px;border-radius:99px;
  border:1px solid var(--border-strong); background:var(--surface-2); color:var(--muted); white-space:nowrap;
}
.badge.ok{color:var(--ok);background:var(--ok-soft);border-color:color-mix(in oklab,var(--ok) 38%,transparent)}
.badge.danger{color:var(--danger);background:var(--danger-soft);border-color:color-mix(in oklab,var(--danger) 38%,transparent)}
.badge.warn{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in oklab,var(--warn) 42%,transparent)}
.badge.info{color:var(--info);background:var(--info-soft);border-color:color-mix(in oklab,var(--info) 38%,transparent)}
.badge.accent{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.days{font-variant-numeric:tabular-nums; font-size:12px; color:var(--faint)}
.days.warn{color:var(--warn); font-weight:600}
.days.danger{color:var(--danger); font-weight:600}

/* ---------- form ---------- */
.form{display:flex;flex-direction:column;gap:18px;max-width:660px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:12.5px;font-weight:600}
.hint{font-size:12px;color:var(--faint)}
input[type=text],input[type=password],select,textarea{
  font:inherit; font-size:13.5px; color:var(--text); background:var(--surface-2);
  border:1px solid var(--border-strong); border-radius:var(--r-sm); padding:8px 11px; width:100%;
}
input.mono{font-family:var(--mono); font-size:13px}
input:hover,select:hover{border-color:var(--faint)}
input[aria-invalid=true]{border-color:var(--danger)}
.err{font-size:12px;color:var(--danger);font-weight:550}
.radios{display:grid;gap:8px}
.radio{
  display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--surface-2);cursor:pointer;
}
.radio:hover{border-color:var(--border-strong)}
.radio:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft)}
.radio input{margin:2px 0 0; accent-color:var(--accent); flex:none}
.radio b{font-size:13px;display:block}
.radio small{color:var(--muted);font-size:12px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
legend{padding:0;font-size:12.5px;font-weight:600}

/* ---------- misc ---------- */
pre.log{
  margin:0; font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word;
  background:var(--bg); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:11px 12px; max-height:260px; overflow:auto; color:var(--muted);
}
pre.pem{
  margin:0; font-size:11.5px; line-height:1.45; white-space:pre; overflow:auto; max-height:300px;
  background:var(--bg); border:1px solid var(--border); border-radius:var(--r-sm); padding:11px 12px;
}
.note{
  display:flex;gap:10px;padding:11px 13px;border-radius:var(--r-sm);font-size:12.5px;
  border:1px solid var(--border-strong); background:var(--surface-2); color:var(--muted); align-items:flex-start;
}
.note svg{flex:none;margin-top:1px}
.note.warn{border-color:color-mix(in oklab,var(--warn) 45%,transparent);background:var(--warn-soft);color:var(--text)}
.note.danger{border-color:color-mix(in oklab,var(--danger) 45%,transparent);background:var(--danger-soft);color:var(--text)}
.note.ok{border-color:color-mix(in oklab,var(--ok) 40%,transparent);background:var(--ok-soft);color:var(--text)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:52px 24px;text-align:center}
.empty .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-3);color:var(--faint)}
.empty h3{font-size:15px}
.empty p{color:var(--muted);max-width:420px;font-size:13px}
.skel{background:var(--surface-3);border-radius:6px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}
.spin{animation:spin .8s linear infinite; transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:3px;background:var(--surface-3);border-radius:99px;overflow:hidden;position:relative}
.bar:after{content:"";position:absolute;inset:0;width:38%;background:var(--accent);border-radius:99px;animation:slide 1.25s ease-in-out infinite}
@keyframes slide{0%{left:-38%}100%{left:100%}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.search{position:relative;flex:1 1 240px;max-width:340px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:31px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.dlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.dlcard{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--surface-2);color:var(--text);text-decoration:none;
}
.dlcard:hover{border-color:var(--accent-line);background:var(--accent-soft);text-decoration:none;color:var(--text)}
.dlcard b{font-family:var(--mono);font-size:12.5px;font-weight:600;display:block}
.dlcard small{color:var(--faint);font-size:11.5px}
.dlcard .dlic{color:var(--accent);flex:none}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,6,9,.62);z-index:60;opacity:0;animation:fade .14s ease forwards}
@keyframes fade{to{opacity:1}}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);z-index:61;
  background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);
  display:flex;flex-direction:column;transform:translateX(14px);opacity:0;animation:slidein .18s ease forwards;
}
@keyframes slidein{to{transform:none;opacity:1}}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border)}
.drawer-b{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;flex:1}
.modal{
  position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-48%);
  width:min(460px,calc(100% - 32px));background:var(--surface);border:1px solid var(--border-strong);
  border-radius:12px;box-shadow:var(--shadow);opacity:0;animation:pop .16s ease forwards;
}
@keyframes pop{to{opacity:1;transform:translate(-50%,-50%)}}
.modal-h{padding:15px 18px 0;display:flex;flex-direction:column;gap:5px}
.modal-b{padding:15px 18px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 12px 12px}
dl{margin:0;display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:8px 16px}
dl dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding-top:2px}
dl dd{margin:0;font-size:13px;word-break:break-word;min-width:0}
dl dd.mono{font-size:12px}
.sans{display:flex;flex-wrap:wrap;gap:5px}
.sans code{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--surface-3);border:1px solid var(--border)}

/* toasts + banner */
#toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:9px;max-width:min(380px,calc(100% - 32px))}
.toast{
  display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r-sm);
  background:var(--surface); border:1px solid var(--border-strong); box-shadow:var(--shadow);
  font-size:13px; animation:tin .18s ease;
}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.toast.out{opacity:0;transform:translateY(6px);transition:.2s}
.toast.ok{border-color:color-mix(in oklab,var(--ok) 45%,transparent)}
.toast.err{border-color:color-mix(in oklab,var(--danger) 48%,transparent)}
.toast .ti{flex:none;margin-top:1px}
.toast.ok .ti{color:var(--ok)} .toast.err .ti{color:var(--danger)} .toast.info .ti{color:var(--info)}
.toast b{display:block;font-size:13px}
.toast p{color:var(--muted);font-size:12.5px}
#banner{background:var(--danger-soft);border-bottom:1px solid color-mix(in oklab,var(--danger) 45%,transparent)}
#banner .brow{max-width:1420px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center;font-size:13px;flex-wrap:wrap}
@media (max-width:640px){
  main{padding:16px 13px 70px}
  .card-b{padding:13px}
  .kpi .v{font-size:24px}
  dl{grid-template-columns:1fr;gap:3px 0}
  dl dd{margin-bottom:9px}
  .drawer{width:100%;border-left:0}
  nav{top:auto}
  header{position:static}
  .node.child{margin-left:8px;padding-left:20px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div id="banner" hidden></div>

<header>
  <div class="hrow">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M14.5 3.5a5 5 0 0 1 7 7l-11 11a5 5 0 0 1-7-7z"/><path d="M9 9l6 6"/></svg>
      </div>
      <div>
        <b id="brandname">Autoridade Certificadora</b>
        <span>console de administração</span>
      </div>
    </div>
    <div class="hspace"></div>
    <div id="statuspill"></div>
    <span id="userctl" style="display:flex;align-items:center;gap:6px"></span>
    <button class="btn icon ghost" id="themebtn" title="Alternar tema" aria-label="Alternar tema"></button>
    <button class="btn sm" data-act="refresh" id="refreshbtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v5h-5"/></svg>
      Atualizar
    </button>
  </div>
</header>

<nav aria-label="Seções">
  <div class="nrow" id="tabs"></div>
</nav>

<main id="view" tabindex="-1"></main>
<div id="layer"></div>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
"use strict";
/* =====================================================================
   Capsule Corp Internal CA — console (vanilla, single file, no deps)
   Modo demonstração opcional: adicione ?demo=1 à URL (padrão = API real).
   ===================================================================== */

/* ---------------- utils ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

function fmtDate(iso, withTime = true) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.toLocaleString("pt-BR", withTime
    ? { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }
    : { day: "2-digit", month: "short", year: "numeric" });
}
const hoursUntil = (iso) => { const d = new Date(iso); return isNaN(d) ? null : (d - Date.now()) / 36e5; };
function daysUntil(iso) { const h = hoursUntil(iso); return h === null ? null : Math.floor(h / 24); }
function shortFp(fp, groups = 8) {
  if (!fp) return "—";
  const parts = String(fp).split(":");
  return parts.length > groups ? parts.slice(0, groups).join(":") + "…" : fp;
}
const SVG = {
  copy: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  alert: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  info: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>',
  dl: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>',
  close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  spin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" class="spin"><path d="M12 3a9 9 0 1 0 9 9" opacity=".9"/></svg>',
  shield: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  cert: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 21l5-3 5 3"/><path d="M8 9h8M8 12.5h5"/></svg>',
  ban: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>',
  sun: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>',
  moon: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
  auto: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none" opacity=".85"/></svg>',
  user: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  key: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="7.5" cy="15.5" r="4"/><path d="M10.5 12.5 20 3M16 7l3 3M14 9l2 2"/></svg>',
  logout: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>',
};

/* ---------------- state ---------------- */
const S = {
  view: "dashboard",
  status: null,
  certs: [],
  loading: { status: true, certs: true },
  error: { status: null, certs: null },
  q: "",
  sort: { key: "days_left", dir: "asc" },
  busy: {},            // { crl:true, setup:true, issue:true, revoke:"1001" }
  initLog: null,
  issueResult: null,   // { cn, serial, log }
  detail: null,        // { serial, data, loading, error }
  wizard: { data: null, error: null },
  postSetup: false,    // apos o setup, a interface migra p/ o cert da CA e recarrega
  auth: { user: null, checked: false },
  loginError: null,
  changepw: false, pwError: null,
  renew: null, renewError: null,
  decodePem: "", decodeResult: null, decodeError: null,
  audit: { rows: [], loading: false, error: null },
  demo: false,
};

/* ---------------- API ---------------- */
class ApiError extends Error {
  constructor(status, detail) { super(detail || ("HTTP " + status)); this.status = status; this.detail = detail; }
}
async function api(path, { method = "GET", body } = {}) {
  if (S.demo) return DEMO.handle(path, method, body);
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      credentials: "same-origin",
    });
  } catch (e) {
    const httpsHint = location.protocol === "https:"
      ? "\n\nDica: se você acabou de configurar a CA, o certificado desta interface mudou (passou a ser o emitido pela sua CA). Recarregue a página (Cmd/Ctrl+Shift+R) e aceite o novo certificado."
      : "";
    throw new ApiError(0, "Falha de rede: não foi possível contatar a API (" + esc(path) + ").\n" + (e && e.message ? e.message : e) + httpsHint);
  }
  if (res.status === 401) {
    S.auth.user = null;
    if (S.auth.checked) render();
    throw new ApiError(401, "Sessão expirada. Entre novamente.");
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
  if (!res.ok) {
    const detail = (data && (data.detail || data.message)) || text || ("HTTP " + res.status);
    throw new ApiError(res.status, typeof detail === "string" ? detail : JSON.stringify(detail, null, 2));
  }
  return data;
}
const dlUrl = {
  ca: (artifact) => "/api/download/ca/" + encodeURIComponent(artifact),
  cert: (serial, kind) => "/api/certs/" + encodeURIComponent(serial) + "/download/" + encodeURIComponent(kind),
};

/* ---------------- banner / toasts ---------------- */
function showAuthBanner() {
  const b = $("#banner");
  b.hidden = false;
  b.innerHTML = '<div class="brow"><span style="color:var(--danger)">' + SVG.alert + '</span>'
    + '<b>Sessão expirada.</b><span style="color:var(--muted)">A autenticação HTTP Basic expirou ou foi recusada — recarregue a página para autenticar novamente.</span>'
    + '<span class="hspace" style="flex:1"></span><button class="btn sm" data-act="reload">Recarregar</button></div>';
}
let toastId = 0;
function toast(kind, title, msg) {
  const id = ++toastId;
  const t = el('<div class="toast ' + kind + '" role="status"><span class="ti">'
    + (kind === "ok" ? SVG.check : kind === "err" ? SVG.alert : SVG.info)
    + '</span><div style="min-width:0"><b>' + esc(title) + '</b>'
    + (msg ? '<p>' + esc(msg) + '</p>' : '') + '</div>'
    + '<button class="btn icon ghost sm" data-toast="' + id + '" aria-label="Fechar aviso">' + SVG.close + '</button></div>');
  t.dataset.tid = id;
  $("#toasts").appendChild(t);
  setTimeout(() => dismissToast(id), kind === "err" ? 9000 : 5000);
}
function dismissToast(id) {
  const n = $('#toasts .toast[data-tid="' + id + '"]');
  if (!n) return;
  n.classList.add("out");
  setTimeout(() => n.remove(), 220);
}

/* ---------------- data loading ---------------- */
async function loadStatus() {
  S.loading.status = true; S.error.status = null; render();
  try { S.status = await api("/api/status"); }
  catch (e) { S.error.status = e; S.status = null; }
  finally { S.loading.status = false; render(); }
}
async function loadCerts() {
  S.loading.certs = true; S.error.certs = null; render();
  try { S.certs = (await api("/api/certs")) || []; }
  catch (e) { S.error.certs = e; S.certs = []; }
  finally { S.loading.certs = false; render(); }
}
const refreshAll = () => Promise.all([loadStatus(), loadCerts()]);

/* ---------------- header + tabs ---------------- */
function renderHeader() {
  const cfg = S.status && S.status.config;
  const bn = $("#brandname");
  if (bn) bn.textContent = cfg && cfg.org ? cfg.org + " · CA" : "Autoridade Certificadora";
  if (cfg && cfg.org) document.title = cfg.org + " — CA Console";
  const loggedIn = !!(S.auth && S.auth.user);
  const rb = $("#refreshbtn"); if (rb) rb.style.display = loggedIn ? "" : "none";
  const uc = $("#userctl");
  if (uc) uc.innerHTML = loggedIn
    ? '<span class="pill" style="gap:6px">' + SVG.user + esc(S.auth.user) + "</span>"
      + '<button class="btn icon ghost" data-act="changepw" title="Trocar senha" aria-label="Trocar senha">' + SVG.key + "</button>"
      + '<button class="btn sm ghost" data-act="logout" title="Sair da sessão">' + SVG.logout + " Sair</button>"
    : "";
  const p = $("#statuspill");
  if (!p) return;
  if (!loggedIn) { p.innerHTML = ""; return; }
  if (S.loading.status && !S.status) { p.innerHTML = '<span class="pill">' + SVG.spin + ' verificando…</span>'; return; }
  if (S.error.status) { p.innerHTML = '<span class="pill warn"><span class="dot"></span>API indisponível</span>'; return; }
  p.innerHTML = S.status && S.status.initialized
    ? '<span class="pill ok"><span class="dot"></span>CA ativa</span>'
    : '<span class="pill warn"><span class="dot"></span>Não inicializada</span>';
}
const TABS = [
  { id: "dashboard", label: "Dashboard" },
  { id: "certs", label: "Certificados" },
  { id: "issue", label: "Emitir" },
  { id: "decode", label: "Consultar" },
  { id: "audit", label: "Auditoria" },
  { id: "ca", label: "CA / Init" },
];
function renderTabs() {
  const n = S.certs.length;
  $("#tabs").innerHTML = TABS.map((t) =>
    '<button class="tab" data-tab="' + t.id + '"' + (S.view === t.id ? ' aria-current="page"' : "") + '>'
    + esc(t.label)
    + (t.id === "certs" && n ? '<span class="cnt">' + n + "</span>" : "")
    + "</button>").join("");
}

/* ---------------- views ---------------- */
function notInitEmpty(text) {
  return '<div class="card"><div class="empty"><div class="ic">' + SVG.shield + '</div>'
    + "<h3>A CA ainda não foi inicializada</h3><p>" + esc(text) + "</p>"
    + '<button class="btn primary" data-tab="ca">Ir para CA / Init</button></div></div>';
}
function apiErrorCard(e, retryAct) {
  const net = e.status === 0;
  return '<div class="card"><div class="card-b stack">'
    + '<div class="note danger">' + SVG.alert + "<div><b>"
    + (net ? "Não foi possível falar com a API" : "Erro " + e.status + " ao consultar a API")
    + '</b><div style="color:var(--muted);margin-top:2px">Verifique se o serviço está no ar na mesma origem desta página.</div></div></div>'
    + '<pre class="log">' + esc(e.detail || e.message) + "</pre>"
    + '<div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn primary" data-act="' + retryAct + '">Tentar novamente</button>'
    + (S.demo ? "" : '<button class="btn ghost" data-act="demo">Ativar modo demonstração</button>') + "</div>"
    + "</div></div>";
}
function copyBtn(value, label = "Copiar") {
  return '<button class="btn sm ghost" data-copy="' + esc(value) + '" title="' + esc(label) + '" aria-label="' + esc(label) + '">' + SVG.copy + "</button>";
}

/* --- dashboard --- */
function viewDashboard() {
  if (S.error.status) return apiErrorCard(S.error.status, "reloadStatus");
  if (S.loading.status && !S.status) {
    return '<div class="stack"><div class="kpis">' + Array.from({ length: 5 }, () =>
      '<div class="kpi"><div class="skel" style="height:11px;width:60%"></div><div class="skel" style="height:26px;width:38%"></div></div>').join("")
      + '</div><div class="card"><div class="card-b"><div class="skel" style="height:88px"></div></div></div></div>';
  }
  const st = S.status || {};
  if (!st.initialized) return notInitEmpty("Sem hierarquia não há certificados nem CRL. A inicialização cria a raiz e a intermediária uma única vez.");

  const c = st.counts || {};
  const exp30 = c.expirando_30d || 0;
  const kpi = (k, v, cls, sub) =>
    '<div class="kpi ' + cls + '"><div class="k">' + k + '</div><div class="v">' + (v ?? 0) + "</div>"
    + (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>";

  let html = '<div class="stack">';
  html += '<div class="kpis">'
    + kpi("Total", c.total, "", "certificados emitidos")
    + kpi("Válidos", c.valido, "ok", "em operação")
    + kpi("Revogados", c.revogado, "danger", "na CRL")
    + kpi("Expirados", c.expirado, "warn", "fora de validade")
    + kpi("Expiram ≤ 30d", exp30, "warn" + (exp30 > 0 ? " hl" : ""), exp30 > 0 ? "renove antes do corte" : "nada no horizonte")
    + "</div>";

  const expiring = S.certs.filter((x) => x.status === "valido" && x.days_left != null && x.days_left <= 30).sort((a, b) => a.days_left - b.days_left);
  if (expiring.length) {
    html += '<div class="card" style="border-color:color-mix(in oklab,var(--warn) 45%,transparent)">'
      + '<div class="card-h"><h2 style="color:var(--warn)">⚠ Expirando em ≤ 30 dias</h2><span class="hspace" style="flex:1"></span><span class="badge warn">' + expiring.length + " cert(s)</span></div>"
      + '<div class="tablewrap"><table><thead><tr><th>Common Name</th><th>Serial</th><th>Expira em</th><th>Ação</th></tr></thead><tbody>'
      + expiring.map((x) => '<tr tabindex="0" data-serial="' + esc(x.serial) + '"><td class="cn">' + esc(x.cn) + '</td><td class="num">' + esc(x.serial)
        + '</td><td><span class="days ' + (x.days_left < 7 ? "danger" : "warn") + '">' + x.days_left + " dias</span></td>"
        + '<td><button class="btn sm" data-renew="' + esc(x.serial) + '">↻ Renovar</button></td></tr>').join("")
      + "</tbody></table></div></div>";
  }

  html += '<div class="grid2">';

  /* hierarquia */
  html += '<div class="card"><div class="card-h"><h2>Hierarquia da CA</h2></div><div class="card-b"><div class="tree">'
    + caNode("root", "Root CA", st.root, true)
    + caNode("intermediate", "Intermediate CA", st.intermediate, false, "child")
    + caNode("ocsp", "OCSP Responder", st.ocsp, false, "child last")
    + "</div></div></div>";

  /* CRL */
  html += crlCard(st.crl);
  html += "</div></div>";
  return html;
}
function caNode(kind, label, node, isRoot, extraCls = "") {
  if (!node) {
    return '<div class="node ' + extraCls + '"><div class="nbox" style="opacity:.7"><div class="nhead"><span class="ntag">'
      + esc(label) + '</span><span class="badge">ausente</span></div>'
      + '<div class="hint">Não presente em <code>/api/status</code>.</div></div></div>';
  }
  const d = daysUntil(node.not_after);
  const cls = d === null ? "" : d < 0 ? "danger" : d < 180 ? "warn" : "ok";
  let m = '<div class="meta">';
  if (node.not_before) m += '<div><span class="l">Início</span><span class="v">' + fmtDate(node.not_before, false) + "</span></div>";
  m += '<div><span class="l">Expira</span><span class="v">' + fmtDate(node.not_after, false)
    + (d !== null ? ' <span class="days ' + (cls === "ok" ? "" : cls) + '">(' + (d < 0 ? "vencido" : d + "d") + ")</span>" : "") + "</span></div>";
  if (node.serial) m += '<div><span class="l">Serial</span><span class="v mono" style="font-size:12px">' + esc(node.serial) + "</span></div>";
  m += "</div>";
  const fp = node.sha256
    ? '<div class="fp" title="' + esc(node.sha256) + '">SHA-256 ' + esc(shortFp(node.sha256)) + copyBtn(node.sha256, "Copiar fingerprint SHA-256") + "</div>"
    : "";
  return '<div class="node ' + extraCls + '"><div class="nbox' + (isRoot ? " root" : "") + '">'
    + '<div class="nhead"><span class="ntag">' + esc(label) + '</span><span class="badge ' + cls + '">'
    + (d === null ? "validade desconhecida" : d < 0 ? "vencido" : "válido") + "</span></div>"
    + '<div class="nsubj">' + esc(node.subject || "—") + "</div>" + m + fp + "</div></div>";
}
function crlCard(crl) {
  const busy = !!S.busy.crl;
  let body;
  if (!crl) {
    body = '<div class="note warn">' + SVG.alert + "<div><b>Nenhuma CRL publicada</b><div>Gere a primeira lista de revogação para os balanceadores validarem os certificados.</div></div></div>";
  } else {
    const h = hoursUntil(crl.next_update);
    const state = h === null ? { cls: "", txt: "—" }
      : h < 0 ? { cls: "danger", txt: "vencida há " + Math.abs(Math.floor(h)) + "h" }
        : h < 48 ? { cls: "warn", txt: "vence em " + Math.floor(h) + "h" }
          : { cls: "ok", txt: "em dia" };
    body = '<div class="stack" style="gap:14px">'
      + (state.cls === "danger" ? '<div class="note danger">' + SVG.alert + "<div><b>CRL vencida</b><div>Os F5/A10 podem rejeitar (ou aceitar indevidamente) certificados. Regenere agora.</div></div></div>"
        : state.cls === "warn" ? '<div class="note warn">' + SVG.alert + "<div><b>CRL perto do vencimento</b><div>Regenere para manter a janela de validação folgada.</div></div></div>" : "")
      + '<dl><dt>Última</dt><dd>' + fmtDate(crl.last_update) + "</dd>"
      + "<dt>Próxima</dt><dd>" + fmtDate(crl.next_update) + ' <span class="badge ' + state.cls + '" style="margin-left:6px">' + esc(state.txt) + "</span></dd>"
      + "<dt>Revogados</dt><dd>" + (crl.revoked_count ?? 0) + " certificado(s)</dd></dl></div>";
  }
  return '<div class="card"><div class="card-h"><h2>CRL</h2><span class="hspace" style="flex:1"></span>'
    + '<button class="btn sm" data-act="crl"' + (busy ? " disabled" : "") + ">"
    + (busy ? SVG.spin + " Regenerando…" : "Regenerar CRL") + "</button></div>"
    + '<div class="card-b">' + body
    + '<div class="dlgrid" style="margin-top:14px">' + dlCard(dlUrl.ca("ca.crl"), "ca.crl", "CRL da intermediária") + "</div>"
    + "</div></div>";
}
function dlCard(href, name, desc) {
  return '<a class="dlcard" href="' + esc(href) + '" data-dl="1" download><span class="dlic">' + SVG.dl
    + "</span><span><b>" + esc(name) + "</b><small>" + esc(desc) + "</small></span></a>";
}

/* --- certificados --- */
const PROFILE = {
  server: { cls: "info", label: "server" },
  client: { cls: "accent", label: "client" },
  dual: { cls: "", label: "dual" },
  ocsp: { cls: "warn", label: "ocsp" },
};
const STATUS = { valido: { cls: "ok", label: "válido" }, revogado: { cls: "danger", label: "revogado" }, expirado: { cls: "warn", label: "expirado" } };

function visibleCerts() {
  const q = S.q.trim().toLowerCase();
  let list = S.certs.filter((c) => !q
    || String(c.cn || "").toLowerCase().includes(q)
    || String(c.serial || "").toLowerCase().includes(q)
    || String(c.subject || "").toLowerCase().includes(q));
  const { key, dir } = S.sort, sgn = dir === "asc" ? 1 : -1;
  list = list.slice().sort((a, b) => {
    let va, vb;
    if (key === "serial") { va = parseInt(a.serial, 16) || a.serial; vb = parseInt(b.serial, 16) || b.serial; }
    else if (key === "cn") { return sgn * String(a.cn || "").localeCompare(String(b.cn || "")); }
    else { va = a.days_left ?? daysUntil(a.not_after) ?? 0; vb = b.days_left ?? daysUntil(b.not_after) ?? 0; }
    return va < vb ? -sgn : va > vb ? sgn : 0;
  });
  return list;
}
function viewCerts() {
  if (S.error.certs) return apiErrorCard(S.error.certs, "reloadCerts");
  if (S.status && !S.status.initialized) return notInitEmpty("Nenhum certificado pode ser emitido antes da hierarquia existir.");
  if (S.loading.certs && !S.certs.length) {
    return '<div class="card"><div class="card-b stack">'
      + Array.from({ length: 6 }, () => '<div class="skel" style="height:34px"></div>').join("") + "</div></div>";
  }
  const list = visibleCerts();
  const arrow = (k) => S.sort.key === k ? '<span class="arw">' + (S.sort.dir === "asc" ? "▲" : "▼") + "</span>" : "";

  let html = '<div class="card"><div class="toolbar">'
    + '<div class="search"><label class="sr" for="q">Filtrar por CN ou serial</label>' + SVG.search
    + '<input id="q" type="text" placeholder="Filtrar por CN ou serial…" value="' + esc(S.q) + '" autocomplete="off"></div>'
    + '<span style="font-size:12.5px;color:var(--muted)">' + list.length + " de " + S.certs.length + " certificado(s)</span>"
    + '<span class="hspace" style="flex:1"></span>'

  if (!S.certs.length) {

      + "<p>A hierarquia está pronta. Emita o primeiro certificado de servidor para publicar uma aplicação atrás do F5.</p>"
      + '<button class="btn primary" data-tab="issue">Emitir certificado</button></div>';
  } else if (!list.length) {
    html += '<div class="empty"><div class="ic">' + SVG.search + "</div><h3>Nada encontrado</h3><p>Nenhum certificado corresponde a <code>" + esc(S.q) + "</code>.</p>"
      + '<button class="btn" data-act="clearq">Limpar filtro</button></div>';
  } else {
    html += '<div class="tablewrap"><table><caption class="sr">Certificados emitidos</caption><thead><tr>'
      + '<th class="sortable" data-sort="serial" scope="col">Serial ' + arrow("serial") + "</th>"
      + '<th class="sortable" data-sort="cn" scope="col">Common Name ' + arrow("cn") + "</th>"
      + '<th scope="col">Perfil</th><th scope="col">Status</th>'
      + '<th class="sortable" data-sort="days_left" scope="col">Expiração ' + arrow("days_left") + "</th>"
      + '<th scope="col">Downloads</th><th scope="col">Ações</th></tr></thead><tbody>';
    for (const c of list) html += certRow(c);
    html += "</tbody></table></div>";
  }
  return html + "</div>";
}
function certRow(c) {
  const p = PROFILE[c.profile] || { cls: "", label: c.profile || "—" };
  const s = STATUS[c.status] || { cls: "", label: c.status || "—" };
  const d = c.days_left ?? daysUntil(c.not_after);
  const dcls = d === null ? "" : d < 0 ? "danger" : d < 30 ? "warn" : "";
  const revoked = c.status === "revogado";
  const dls = ['<a href="' + dlUrl.cert(c.serial, "cert") + '" data-dl="1" download title="Certificado (PEM)">cert</a>',
    '<a href="' + dlUrl.cert(c.serial, "chain") + '" data-dl="1" download title="Cadeia completa — use no F5">chain</a>'];
  dls.push(revoked ? '<span title="Indisponível para certificado revogado">key</span>' : '<a href="' + dlUrl.cert(c.serial, "key") + '" data-dl="1" download title="Chave privada">key</a>');
  dls.push(revoked ? '<span title="Indisponível para certificado revogado">zip</span>' : '<a href="' + dlUrl.cert(c.serial, "bundle") + '" data-dl="1" download title="Pacote .zip: cert + key + chain + p12 + senha (30 chars)">zip</a>');
  const busy = S.busy.revoke === c.serial;
  return '<tr tabindex="0" data-serial="' + esc(c.serial) + '">'
    + '<td class="num">' + esc(c.serial) + "</td>"
    + '<td class="cn">' + esc(c.cn || "—") + "</td>"
    + '<td><span class="badge ' + p.cls + '">' + esc(p.label) + "</span></td>"
    + '<td><span class="badge ' + s.cls + '">' + esc(s.label) + "</span></td>"
    + "<td><div>" + fmtDate(c.not_after, false) + '</div><div class="days ' + dcls + '">'
    + (d === null ? "" : d < 0 ? "expirado há " + Math.abs(d) + "d" : d + " dias restantes") + "</div></td>"
    + '<td><div class="dl">' + dls.join("") + "</div></td>"
    + "<td>" + (c.status === "valido"
      ? '<button class="btn sm danger" data-revoke="' + esc(c.serial) + '"' + (busy ? " disabled" : "") + ">"
        + (busy ? SVG.spin : SVG.ban) + " Revogar</button>"
      : revoked ? '<span class="hint" title="' + esc(c.revoke_reason || "") + '">' + esc(c.revoke_reason || "revogado") + "</span>"
        : '<span class="hint">—</span>') + "</td></tr>";
}

      + dlCard(dlUrl.ca("intermediate.crt"), "intermediate.crt", "certificado da intermediária")
      + dlCard(dlUrl.ca("ca-chain.crt"), "ca-chain.crt", "cadeia raiz + intermediária")
      + dlCard(dlUrl.ca("ca.crl"), "ca.crl", "CRL da intermediária")
      + dlCard(dlUrl.ca("root.crl"), "root.crl", "CRL da raiz")

      + caNode("root", "Root CA", st.root, true)

/* ---------------- detail drawer ---------------- */
let lastFocused = null;
async function openDetail(serial) {
  S.detail = { serial, data: null, loading: true, error: null };
  renderLayer();
  try { S.detail.data = await api("/api/certs/" + encodeURIComponent(serial)); }
  catch (e) { S.detail.error = e; }
  finally { if (S.detail) { S.detail.loading = false; renderLayer(); } }
}
function closeLayer() {
  S.detail = null; S.revoke = null; S.changepw = false; S.renew = null;
  $("#layer").innerHTML = "";
  document.body.style.overflow = "";
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus({ preventScroll: true });
  lastFocused = null;
}
function renderLayer() {
  const L = $("#layer");
  if (!S.detail && !S.revoke && !S.changepw && !S.renew) { L.innerHTML = ""; document.body.style.overflow = ""; return; }
  if (!lastFocused) lastFocused = document.activeElement;
  document.body.style.overflow = "hidden";
  L.innerHTML = '<div class="scrim" data-act="close"></div>'
    + (S.changepw ? changePwModal() : S.renew ? renewModal() : S.revoke ? revokeModal() : detailDrawer());
  const box = L.querySelector(".drawer,.modal");
  const first = box.querySelector("select,input,button:not([disabled])");

let elapsedTimer = null;
async function submitSetup() {
  const d = S.wizard.data || {};
  const errs = [];
  const domain = (d.domain || "").trim().toLowerCase();
  if (!/^([a-z0-9](-*[a-z0-9])*\.)+[a-z]{2,}$/.test(domain)) errs.push("Domínio inválido (ex: capsule.lab.br).");
  if (!(d.org || "").trim()) errs.push("Organização (O) é obrigatória.");
  const country = (d.country || "BR").trim();
  if (!/^[A-Za-z]{2}$/.test(country)) errs.push("País (C) deve ter 2 letras.");
  if ((d.pass || "").length < 8) errs.push("A passphrase da raiz precisa de ao menos 8 caracteres.");
  if ((d.pass || "") !== (d.pass2 || "")) errs.push("As passphrases não coincidem.");
  for (const k of ["root_days", "intermediate_days", "leaf_days", "crl_days"]) {
    if (d[k] && !/^\d+$/.test(String(d[k]).trim())) errs.push("“" + k + "” deve ser um número inteiro.");
  }
  if (errs.length) { S.wizard.error = errs.join(" "); render(); return; }

  S.wizard.error = null; S.busy.setup = true; S.initLog = null; render();
  const t0 = Date.now();
  elapsedTimer = setInterval(() => { const n = $("#w-elapsed"); if (n) n.textContent = Math.round((Date.now() - t0) / 1000) + "s"; }, 1000);
  const num = (v, dflt) => { const n = parseInt(String(v || "").trim(), 10); return isNaN(n) ? dflt : n; };
  const body = {
    domain, org: (d.org || "").trim(), ou: (d.ou || "").trim(), country: country.toUpperCase(),
    state: (d.state || "").trim(), locality: (d.locality || "").trim(),
    root_cn: (d.root_cn || "").trim(), intermediate_cn: (d.intermediate_cn || "").trim(),
    ca_host: (d.ca_host || "").trim(), ocsp_host: (d.ocsp_host || "").trim(), admin_host: (d.admin_host || "").trim(),
    key_size: num(d.key_size, 4096), leaf_key_size: num(d.leaf_key_size, 2048),
    root_days: num(d.root_days, 3650), intermediate_days: num(d.intermediate_days, 1825),
    leaf_days: num(d.leaf_days, 375), crl_days: num(d.crl_days, 30),
    digest: d.digest || "sha256", passphrase: d.pass,
  };
  try {
    const res = await api("/api/setup", { method: "POST", body });
    S.initLog = (res && res.log) || "Hierarquia criada.";
    toast("ok", "CA configurada", "Domínio " + domain + " · hierarquia criada em " + Math.round((Date.now() - t0) / 1000) + "s.");
    S.wizard.data.pass = ""; S.wizard.data.pass2 = "";
    // O nginx vai trocar o cert desta interface pelo emitido pela CA (~10s).
    // Recarregamos para reabrir a conexão TLS com o novo cert (sem "Failed to fetch").
    S.postSetup = true;
    setTimeout(() => { try { location.reload(); } catch (_) { } }, 13000);
  } catch (e) {
    if (e.status === 409) { toast("info", "CA já inicializada", "Atualizando o estado."); await refreshAll(); }
    else { S.wizard.error = e.detail || e.message; S.initLog = e.detail || null; apiToast("Falha na configuração", e); }
  } finally {
    clearInterval(elapsedTimer); S.busy.setup = false; render();
  }
}
async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (_) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
    } catch (__) { ok = false; }
  }
  if (ok && btn) {
    const old = btn.innerHTML; btn.innerHTML = SVG.check;
    setTimeout(() => { btn.innerHTML = old; }, 1100);
  }
  if (!ok) toast("err", "Não foi possível copiar", "Selecione o texto manualmente.");
}

/* ---------------- consultar (decode PEM) ---------------- */
function renderDecoded(dec) {
  const pk = dec.public_key || {};
  const pkTxt = (pk.type || "?") + (pk.size ? " " + pk.size : "") + (pk.curve ? " " + pk.curve : "");
  const pair = (arr) => (arr || []).map((p) => p.attr + "=" + p.value).join(", ");
  const rows = [
    ["Versão", dec.version], ["Serial", dec.serial_hex],
    ["Assinatura", dec.signature_algorithm], ["Chave pública", pkTxt],
    ["Subject", pair(dec.subject)], ["Issuer", pair(dec.issuer)],
    ["Auto-assinado", dec.self_signed ? "sim" : "não"],
    ["Validade", fmtDate(dec.not_before) + " → " + fmtDate(dec.not_after) + " (" + dec.days_left + "d" + (dec.expired ? ", EXPIRADO" : "") + ")"],
    ["SHA-256", dec.fingerprints && dec.fingerprints.sha256], ["SHA-1", dec.fingerprints && dec.fingerprints.sha1],
  ];
  let html = "<dl>" + rows.map(([k, v]) => "<dt>" + k + '</dt><dd class="mono" style="word-break:break-all">' + esc(v || "—") + "</dd>").join("") + "</dl>";
  html += '<div class="sec-title" style="margin:16px 0 8px">Extensões</div><div class="tablewrap"><table style="min-width:0"><tbody>';
  for (const e of (dec.extensions || [])) {
    let val = e.value;
    if (Array.isArray(val)) val = val.map((x) => esc(x && typeof x === "object" ? (x.method + ": " + x.location) : x)).join("<br>");
    else if (val && typeof val === "object") val = Object.entries(val).map(([k, v]) => esc(k + ": " + v)).join(", ");
    else val = esc(val);
    html += '<tr><td class="mono" style="white-space:nowrap;vertical-align:top">' + esc(e.name)
      + (e.critical ? ' <span class="badge danger">crít</span>' : "") + '</td><td class="mono">' + (val || "—") + "</td></tr>";
  }
  return html + "</tbody></table></div>";
}

async function doRenew() {
  const r = S.renew; if (!r) return;
  const box = $("#layer");
  const profile = (box.querySelector("input[name=rn-profile]:checked") || {}).value || "server";
  const sans = ($("#rn-sans").value || "").trim();
  const p12 = $("#rn-p12").value || "";
  const revokeOld = !!($("#rn-revoke") && $("#rn-revoke").checked);
  S.busy.renew = true; S.renewError = null; renderLayer();
  try {
    await api("/api/certs/" + encodeURIComponent(r.serial) + "/renew",
      { method: "POST", body: { profile, sans, p12_password: p12, revoke_old: revokeOld, reason: "superseded" } });
    S.busy.renew = false; S.renew = null; closeLayer();
    toast("ok", "Certificado renovado", r.cn + (revokeOld ? " · antigo revogado" : " · antigo mantido"));
    await refreshAll();
  } catch (e) {
    S.busy.renew = false; S.renewError = e.detail || e.message || "Falha ao renovar."; renderLayer();
  }
}

function ocspBadge(o) {
  const cls = o.status === "good" ? "ok" : o.status === "revoked" ? "danger" : o.status === "unknown" ? "warn" : "";
  return '<span class="badge ' + cls + '">OCSP: ' + esc(o.status) + "</span>"
    + (o.verify_ok === false ? ' <span class="hint">assinatura não verificada</span>' : "");
}
function ocspBlock(d) {
  const o = d.ocsp;
  return '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
    + '<button class="btn sm" data-ocsp="' + esc(d.serial) + '"' + (o && o.loading ? " disabled" : "") + ">"
    + (o && o.loading ? SVG.spin + " Consultando OCSP…" : "Verificar OCSP ao vivo") + "</button>"
    + (o && !o.loading && o.status ? ocspBadge(o) : "") + "</div>";
}
async function checkOcsp(serial) {
  if (!S.detail || String(S.detail.serial) !== String(serial)) return;
  S.detail.ocsp = { loading: true }; renderLayer();
  try {
    const r = await api("/api/certs/" + encodeURIComponent(serial) + "/ocsp");
    S.detail.ocsp = { loading: false, status: r.status, verify_ok: r.verify_ok };
  } catch (e) {
    S.detail.ocsp = { loading: false, status: "erro", verify_ok: false };
  }
  if (S.detail) renderLayer();
}

document.addEventListener("click", (ev) => {
  const t = ev.target;
  const copy = t.closest("[data-copy]");
  if (copy) { ev.preventDefault(); ev.stopPropagation(); copyText(copy.dataset.copy, copy); return; }
  const tst = t.closest("[data-toast]");
  if (tst) { dismissToast(+tst.dataset.toast); return; }
  const tab = t.closest("[data-tab]");
  if (tab) {
    S.view = tab.dataset.tab; const e = $("#errlog"); if (e) e.remove();
    if (S.view === "audit") loadAudit(); else render();
    window.scrollTo({ top: 0 }); return;
  }
  const rv = t.closest("[data-revoke]");
  if (rv) {
    ev.preventDefault(); ev.stopPropagation();
    const serial = rv.dataset.revoke;
    const c = S.certs.find((x) => String(x.serial) === serial) || (S.detail && S.detail.data) || {};
    S.revoke = { serial, cn: c.cn }; renderLayer();
    return;
  }
  const rn = t.closest("[data-renew]");
  if (rn) {
    ev.preventDefault(); ev.stopPropagation();
    const serial = rn.dataset.renew;
    const c = S.certs.find((x) => String(x.serial) === serial) || (S.detail && S.detail.data) || {};
    const sans = Array.isArray(c.sans) ? c.sans.join(",") : "";
    S.renew = { serial, cn: c.cn, profile: (c.profile === "server" || c.profile === "client" || c.profile === "dual") ? c.profile : "server", sans };
    S.renewError = null; renderLayer();
    return;
  }
  const oc = t.closest("[data-ocsp]");
  if (oc) { ev.preventDefault(); ev.stopPropagation(); checkOcsp(oc.dataset.ocsp); return; }
  const so = t.closest("[data-serial-open]");
  if (so) { openDetail(so.dataset.serialOpen); return; }
  const sortTh = t.closest("th[data-sort]");
  if (sortTh) {
    const k = sortTh.dataset.sort;
    S.sort = { key: k, dir: S.sort.key === k && S.sort.dir === "asc" ? "desc" : "asc" };
    render(); return;
  }
  if (t.closest("[data-dl]")) {
    if (S.demo) { ev.preventDefault(); toast("info", "Download indisponível", "O modo demonstração não serve arquivos."); }
    return;
  }
  const act = t.closest("[data-act]");
  if (act) {
    ev.preventDefault();
    const a = act.dataset.act;
    if (a === "refresh") { const e = $("#errlog"); if (e) e.remove(); refreshAll(); }
    else if (a === "reloadStatus") loadStatus();
    else if (a === "reloadCerts") loadCerts();
    else if (a === "reload") location.reload();
    else if (a === "close") closeLayer();
    else if (a === "doRevoke") doRevoke();
    else if (a === "crl") regenCrl();
    else if (a === "clearq") { S.q = ""; render(); }
    else if (a === "dismisslog") { const e = $("#errlog"); if (e) e.remove(); }
    else if (a === "demo") enableDemo();
    else if (a === "logout") doLogout();
    else if (a === "changepw") { S.changepw = true; S.pwError = null; renderLayer(); }
    else if (a === "doChangePw") doChangePw();
    else if (a === "doRenew") doRenew();
    else if (a === "reloadAudit") loadAudit();
    return;
  }
  const row = t.closest("tbody tr[data-serial]");
  if (row) openDetail(row.dataset.serial);
});

document.addEventListener("keydown", (ev) => {
  const box = $("#layer").querySelector(".drawer,.modal");
  if (!box) return;
  if (ev.key === "Escape") { ev.preventDefault(); if (!S.busy.revoke) closeLayer(); return; }
  if (ev.key !== "Tab") return;
  const f = [...box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea,[tabindex]:not([tabindex="-1"])')]
    .filter((n) => n.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (ev.shiftKey && (document.activeElement === first || document.activeElement === box)) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
});

    if (path === "/api/crl/regenerate") {
      await new Promise((r) => setTimeout(r, 900));
      s.crl = { last_update: new Date().toISOString(), next_update: new Date(Date.now() + 7 * 864e5).toISOString(), revoked_count: s.certs.filter((x) => x.status === "revogado").length };
      return { ok: true, log: "[crl] gerando CRL da intermediária…\n[crl] publicada." };
    }
    m = path.match(/^\/api\/certs\/([^/]+)$/);
    if (m) {
      const c = s.certs.find((x) => x.serial === m[1]);
      if (!c) throw new ApiError(404, "certificado não encontrado");
      const pem = "-----BEGIN CERTIFICATE-----\n" + Array.from({ length: 14 }, (_, i) =>
        btoa(c.serial + c.cn + i).repeat(3).slice(0, 64)).join("\n") + "\n-----END CERTIFICATE-----";
      return Object.assign({}, c, {
        subject_full: c.subject + ",L=Sao Paulo,ST=SP",
        issuer: "CN=Capsule Corp Intermediate CA,O=Capsule Corp,C=BR",
        not_before: new Date(Date.now() - 40 * 864e5).toISOString(),
        sha256: "3C:71:AE:0D:52:9B:64:F8:10:D3:2A:B6:47:CE:85:1F:99:20:7B:C4:66:E5:38:AD:02:74:9F:B1:5C:E0:83:6A",
        pem,
      });
    }
    throw new ApiError(404, "endpoint não encontrado no modo demonstração: " + path);
  },
};
function enableDemo() {
  S.demo = true;
  S.error.status = null; S.error.certs = null;
  toast("info", "Modo demonstração", "Dados sintéticos locais — nenhuma chamada real à API.");
  refreshAll();
}
window.__caDemo = enableDemo;

/* ---------------- boot ---------------- */
if (new URLSearchParams(location.search).has("demo") || location.protocol === "file:") S.demo = true;
async function boot() {
  try {
    const me = await api("/api/me");
    S.auth = { user: me.user, checked: true };
    render();
    refreshAll();
  } catch (e) {
    S.auth = { user: null, checked: true };
    render();
  }
}
boot();
</script>
